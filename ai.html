<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#6d28d9" />
<title>TRAVO AI — مساعد السفر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="ai.css" />
</head>
<body>
<div class="ai-page">
<header class="ai-nav glass"><a class="brand ai-brand" href="index.html"><div class="logo">T</div><div><b>TRAVO AI</b><span data-a="tagline">محادثة سفر مستقلة</span></div></a><div class="ai-nav-actions"><a class="ghost ai-link" href="index.html" data-a="home">الرئيسية</a><a class="ghost ai-link" href="trip.html" data-a="trip">رحلتي</a><button id="aiLang" class="ghost">EN</button></div></header>
<main class="chat-shell">
  <section class="chat-side">
    <p class="eyebrow">TRAVO AI</p><h1 data-a="title">اسأل عن السفر.<br>وخلك داخل المحادثة.</h1><p data-a="sub">خطط يومك، قارن أحياء، اسأل عن التنقل، أو اطلب من TRAVO مساعدتك في بناء رحلة.</p>
    <label class="context-field"><span data-a="cityLabel">المدينة أو الوجهة — اختياري</span><input id="aiCity" data-a-ph="cityPh" placeholder="مثال: دبي"></label>
    <div class="quick-prompts"><button data-p="خطط لي يوم كامل في دبي بين المطاعم والتجارب">يوم كامل</button><button data-p="وش أفضل منطقة أسكن فيها إذا أبي مطاعم وتمشية؟">اختيار حي</button><button data-p="رتب لي التنقل بأقل وقت ممكن بين الأماكن">أقل تنقل</button><button data-p="اقترح لي خطة سفر تناسب التصوير وصناعة المحتوى">تصوير ومحتوى</button></div>
    <div id="aiStatus" class="ai-status"><i></i><span data-a="checking">جاري فحص الاتصال…</span></div>
  </section>
  <section class="chat-panel panel">
    <div id="aiConversation" class="conversation"><div class="chat-bubble assistant"><b>TRAVO AI</b><span data-a="hello">أهلًا! قل لي وين ناوي تروح أو وش تحتاج، وأنا أساعدك داخل المحادثة.</span></div></div>
    <div class="composer"><textarea id="aiMessage" rows="1" data-a-ph="messagePh" placeholder="اكتب رسالتك…"></textarea><button id="aiSubmit" class="primary" data-a="send">إرسال</button></div>
  </section>
</main>
</div>
<nav class="bottom-nav glass ai-bottom"><a href="index.html">⌂<small data-a="home">الرئيسية</small></a><a href="discover.html">✦<small data-a="discover">اكتشف</small></a><a href="trip.html">✈<small data-a="trip">رحلتي</small></a><a class="active" href="ai.html">✧<small>AI</small></a><a href="plans.html">◇<small data-a="plans">الباقات</small></a></nav>
<script src="ai.js"></script>
</body>
</html>
